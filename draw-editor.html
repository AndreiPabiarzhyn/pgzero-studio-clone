<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="drawEditor.pageTitle">Редактор спрайтов — PGZero Studio</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #5b7a9d;
        }

        #drawEditorApp {
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: var(--pz-font, "Nunito", sans-serif);
        }

        .de-topbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--pz-bg-elevated, #fff);
            border-bottom: 2px solid var(--pz-border, #c7ddff);
            flex-shrink: 0;
        }

        .de-brand {
            font-weight: 800;
            font-size: 15px;
            color: var(--pz-text, #1e3a5f);
            margin-right: 4px;
        }

        .de-group {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px;
            border-radius: 12px;
            background: var(--pz-surface, #f8fbff);
            border: 1px solid var(--pz-border, #c7ddff);
        }

        .de-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-width: 36px;
            height: 36px;
            padding: 0 8px;
            border: 2px solid transparent;
            border-radius: 10px;
            background: transparent;
            color: var(--pz-text, #1e3a5f);
            font: inherit;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }

        .de-btn:hover {
            background: var(--pz-accent-soft, rgba(91, 141, 239, 0.12));
        }

        .de-btn--danger {
            color: var(--pz-danger, #f87171);
        }

        .de-btn--accent {
            background: var(--pz-accent, #5b8def);
            color: #fff;
        }

        .de-btn--accent:hover {
            background: var(--pz-accent-hover, #4a7de0);
        }

        .de-size {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0 10px;
            font-weight: 700;
            font-size: 13px;
            color: var(--pz-text, #1e3a5f);
        }

        .de-size input[type="range"] {
            width: 100px;
        }

        .de-main {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .de-sidebar {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 8px;
            background: var(--pz-bg-elevated, #fff);
            border-right: 2px solid var(--pz-border, #c7ddff);
            flex-shrink: 0;
        }

        .de-tool {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            width: 56px;
            padding: 6px 4px;
            border: 2px solid transparent;
            border-radius: 12px;
            background: transparent;
            color: var(--pz-text, #1e3a5f);
            font: inherit;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .de-tool svg {
            width: 22px;
            height: 22px;
        }

        .de-tool:hover {
            background: var(--pz-accent-soft);
        }

        .de-tool.active {
            border-color: var(--pz-accent, #5b8def);
            background: var(--pz-accent-soft);
            color: var(--pz-accent, #5b8def);
        }

        .de-viewport {
            flex: 1;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(45deg, #6b8499 25%, transparent 25%),
                linear-gradient(-45deg, #6b8499 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #6b8499 75%),
                linear-gradient(-45deg, transparent 75%, #6b8499 75%);
            background-size: 24px 24px;
            background-position: 0 0, 0 12px, 12px -12px, -12px 0;
            background-color: #8899aa;
        }

        .de-stage {
            transform-origin: center center;
            flex-shrink: 0;
            padding: 32px;
        }

        .de-canvas-wrap {
            position: relative;
            display: inline-block;
            background-image:
                linear-gradient(45deg, #ccc 25%, transparent 25%),
                linear-gradient(-45deg, #ccc 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #ccc 75%),
                linear-gradient(-45deg, transparent 75%, #ccc 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            border: 2px solid #fff;
            border-radius: 4px;
        }

        #cd-canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: transparent;
        }

        #canvasResizeHandle {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 14px;
            height: 14px;
            background: var(--pz-accent, #5b8def);
            border: 2px solid #fff;
            border-radius: 3px 0 0 0;
            cursor: nwse-resize;
            transform-origin: bottom right;
        }

        .de-bottom {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: var(--pz-bg-elevated, #fff);
            border-top: 2px solid var(--pz-border, #c7ddff);
            flex-shrink: 0;
        }

        #colorPicker {
            width: 40px;
            height: 32px;
            padding: 0;
            border: 2px solid var(--pz-border);
            border-radius: 8px;
            cursor: pointer;
            background: none;
        }

        #colorPalette {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            flex: 1;
        }

        .de-swatch {
            width: 22px;
            height: 18px;
            padding: 0;
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 4px;
            cursor: pointer;
        }

        .de-hint {
            font-size: 11px;
            color: var(--pz-text-muted, #5b7a9d);
            white-space: nowrap;
        }

        .de-brush-cursor {
            position: fixed;
            pointer-events: none;
            border: 1.5px solid rgba(30, 58, 95, 0.92);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.92);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10000;
            box-sizing: border-box;
        }

        .de-brush-cursor.is-square {
            border-radius: 1px;
        }

        .de-brush-cursor.is-eraser {
            border-style: dashed;
            background: rgba(255, 255, 255, 0.12);
        }

        .de-brush-cursor[hidden] {
            display: none !important;
        }

        .de-tool .de-icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .de-tool .de-icon--stroke {
            fill: none;
            stroke: currentColor;
            stroke-width: 1.75;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .de-btn .de-icon--stroke {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(30, 58, 95, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: var(--pz-radius, 14px);
            max-width: 360px;
            width: 90vw;
            box-shadow: var(--pz-shadow);
        }

        .modal-content h3 {
            margin: 0 0 8px;
            color: var(--pz-text);
        }

        .modal-content p {
            margin: 0 0 12px;
            color: var(--pz-text-muted);
        }

        .modal-input-wrapper input {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--pz-border);
            border-radius: 10px;
            font: inherit;
            box-sizing: border-box;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 10px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-ok { background: var(--pz-play, #34c759); color: #fff; }
        .btn-cancel { background: #e2e8f0; color: var(--pz-text); }
    </style>
</head>
<body>
<div id="drawEditorApp">
    <header class="de-topbar">
        <span class="de-brand" data-i18n="drawEditor.brand">Спрайт</span>

        <div class="de-group">
            <button type="button" id="openBtn" class="de-btn" data-i18n-title="drawEditor.open" title="Открыть"><span data-i18n="drawEditor.open">Открыть</span></button>
            <button type="button" id="saveBtn" class="de-btn" data-i18n-title="drawEditor.saveDownloadTitle" title="Скачать PNG"><span data-i18n="drawEditor.save">Сохранить</span></button>
            <button type="button" id="undoBtn" class="de-btn" data-i18n-title="drawEditor.undo" title="Отменить">
                <svg class="de-icon--stroke" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7H5v4"/><path d="M5 11c1.5-3 4.5-5 8-5 4.4 0 8 3.6 8 8s-3.6 8-8 8"/></svg>
            </button>
            <button type="button" id="redoBtn" class="de-btn" data-i18n-title="drawEditor.redo" title="Повторить">
                <svg class="de-icon--stroke" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7h4v4"/><path d="M19 11c-1.5-3-4.5-5-8-5-4.4 0-8 3.6-8 8s3.6 8 8 8"/></svg>
            </button>
        </div>

        <div class="de-group">
            <button type="button" id="zoomOutBtn" class="de-btn" data-i18n-title="drawEditor.zoomOut" title="Уменьшить">−</button>
            <span id="zoomLabel" class="de-size" style="min-width:3ch;text-align:center;">4×</span>
            <button type="button" id="zoomInBtn" class="de-btn" data-i18n-title="drawEditor.zoomIn" title="Увеличить">+</button>
            <button type="button" id="zoom11Btn" class="de-btn" data-i18n-title="drawEditor.zoom100" title="100%">1:1</button>
            <button type="button" id="zoomFitBtn" class="de-btn" data-i18n-title="drawEditor.zoomFit" title="Вписать">⊡</button>
        </div>

        <label class="de-size">
            <span id="brushSizeTitle" data-i18n="drawEditor.brush">Кисть</span>
            <input type="range" id="brushSize" min="1" max="32" value="1">
            <span id="brushSizeLabel">1</span> px
        </label>

        <button type="button" id="closeBtn" class="de-btn de-btn--accent" style="margin-left:auto;" data-i18n="drawEditor.done">Готово</button>
        <input type="file" id="fileInput" accept="image/*" hidden>
    </header>

    <div class="de-main">
        <aside class="de-sidebar">
            <button type="button" class="de-tool active" data-tool="brush" data-i18n-title="drawEditor.brush" title="Кисть">
                <svg class="de-icon de-icon--stroke" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18.4 3.6l2 2c.8.8.8 2 0 2.8l-9 9-3.8 1 1-3.8 9-9c.8-.8 2-.8 2.8 0z"/>
                    <path d="M3 21h7.5"/>
                </svg>
                <span data-i18n="drawEditor.brush">Кисть</span>
            </button>
            <button type="button" class="de-tool" data-tool="pencil" data-i18n-title="drawEditor.pencilTitle" title="Пиксельный карандаш">
                <svg class="de-icon de-icon--stroke" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="5" y="5" width="4" height="4" fill="currentColor" stroke="none"/>
                    <rect x="9" y="9" width="4" height="4" fill="currentColor" stroke="none" opacity="0.65"/>
                    <path d="M13 13l7 7"/>
                    <path d="M16 16l3 3"/>
                </svg>
                <span data-i18n="drawEditor.pencil">Пиксель</span>
            </button>
            <button type="button" class="de-tool" data-tool="mirror" data-i18n-title="drawEditor.mirrorBrushTitle" title="Зеркальная кисть">
                <svg class="de-icon de-icon--stroke" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 3v18"/>
                    <path d="M6 9c1.5-1.5 3.5-1.5 5 0"/>
                    <path d="M18 9c-1.5-1.5-3.5-1.5-5 0"/>
                    <path d="M6 15c1.5 1.5 3.5 1.5 5 0"/>
                    <path d="M18 15c-1.5 1.5-3.5 1.5-5 0"/>
                </svg>
                <span data-i18n="drawEditor.mirror">Зеркало</span>
            </button>
            <button type="button" class="de-tool" data-tool="eraser" data-i18n-title="drawEditor.eraser" title="Ластик">
                <svg class="de-icon de-icon--stroke" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M7 20h10"/>
                    <path d="M19 7l-4-4a2 2 0 0 0-2.8 0L5 14l5 5 9.2-9.2a2 2 0 0 0 0-2.8z"/>
                </svg>
                <span data-i18n="drawEditor.eraser">Ластик</span>
            </button>
            <button type="button" class="de-tool" data-tool="fill" data-i18n-title="drawEditor.fill" title="Заливка">
                <svg class="de-icon de-icon--stroke" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2l8 8-8 8-8-8 8-8z"/>
                    <path d="M5 22h14"/>
                </svg>
                <span data-i18n="drawEditor.fill">Заливка</span>
            </button>
            <button type="button" class="de-tool" data-tool="eyedropper" data-i18n-title="drawEditor.eyedropper" title="Пипетка">
                <svg class="de-icon de-icon--stroke" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 20l4-4"/>
                    <path d="M8 16l8-8 2 2-8 8-2-2z"/>
                    <path d="M16 6l2 2"/>
                </svg>
                <span data-i18n="drawEditor.eyedropper">Пипетка</span>
            </button>
            <button type="button" class="de-tool de-tool-action" id="clearBtn" data-i18n-title="drawEditor.clearCanvasTitle" title="Очистить холст">
                <svg class="de-icon de-icon--stroke" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 7h16"/>
                    <path d="M7 7l1 12h8l1-12"/>
                    <path d="M9 7V5h6v2"/>
                    <path d="M10 11v5M14 11v5"/>
                </svg>
                <span data-i18n="drawEditor.clear">Очистить</span>
            </button>
        </aside>

        <div class="de-viewport" id="viewport">
            <div class="de-stage" id="canvasStage">
                <div class="de-canvas-wrap" id="canvasContainer">
                    <canvas id="cd-canvas" width="128" height="128"></canvas>
                    <div id="canvasResizeHandle" data-i18n-title="drawEditor.resizeHandle" title="Изменить размер холста"></div>
                </div>
            </div>
        </div>
    </div>

    <footer class="de-bottom">
        <input type="color" id="colorPicker" value="#000000">
        <div id="colorPalette"></div>
        <span class="de-hint" data-i18n="drawEditor.hint">Круг у курсора — размер кисти · Ctrl + колёсико — зум</span>
    </footer>
</div>

<div id="brushCursor" class="de-brush-cursor" hidden aria-hidden="true"></div>

<div id="modal-container" class="modal-overlay">
    <div class="modal-content">
        <h3 id="modal-title"></h3>
        <p id="modal-text"></p>
        <div id="modal-input-wrapper" class="modal-input-wrapper" style="display:none;">
            <input type="text" id="modal-input-field" data-i18n-placeholder="modal.inputPlaceholder" placeholder="Введите текст…">
        </div>
        <div class="modal-buttons">
            <button type="button" id="modal-cancel-btn" class="btn btn-cancel" data-i18n="common.cancel">Отмена</button>
            <button type="button" id="modal-ok-btn" class="btn btn-ok" data-i18n="common.ok">OK</button>
        </div>
    </div>
</div>

<script src="./lib/i18n.js?v=0.051"></script>
<script src="./lib/jsfs2.js"></script>
<script src="./lib/draw-editor.js?v=0.051"></script>
<script>
var ModalUI = {
    container: document.getElementById('modal-container'),
    title: document.getElementById('modal-title'),
    text: document.getElementById('modal-text'),
    inputWrapper: document.getElementById('modal-input-wrapper'),
    inputField: document.getElementById('modal-input-field'),
    okBtn: document.getElementById('modal-ok-btn'),
    cancelBtn: document.getElementById('modal-cancel-btn'),

    show: function (title, text, type) {
        var self = this;
        return new Promise(function (resolve) {
            self.title.textContent = title || '';
            self.text.textContent = text || '';
            self.inputField.value = '';
            self.inputWrapper.style.display = type === 'input' ? 'block' : 'none';
            self.cancelBtn.style.display = type === 'message' ? 'none' : 'inline-block';
            self.container.style.display = 'flex';

            function cleanup() {
                self.container.style.display = 'none';
            }

            self.okBtn.onclick = function () {
                cleanup();
                resolve(type === 'input' ? self.inputField.value : true);
            };
            self.cancelBtn.onclick = function () {
                cleanup();
                resolve(type === 'input' ? null : false);
            };

            if (type === 'input') setTimeout(function () { self.inputField.focus(); }, 80);
        });
    }
};

function message(title, text) { return ModalUI.show(title, text, 'message'); }
function askConfirm(title, text) { return ModalUI.show(title, text, 'confirm'); }
function input(title, text) { return ModalUI.show(title, text, 'input'); }

document.addEventListener('DOMContentLoaded', function () {
    if (typeof window.FileSystem !== 'undefined') {
        window.jsfs = new window.FileSystem('PGZfs');
    }
    PGZI18n.init().then(function () {
        document.title = PGZI18n.t('drawEditor.pageTitle');
        if (typeof initDrawEditor === 'function') initDrawEditor();
    });
});
</script>
</body>
</html>
