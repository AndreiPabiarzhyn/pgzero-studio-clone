<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор спрайтов — PGZero Studio</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #5b7a9d;
        }

        #drawEditorApp {
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: var(--pz-font, "Nunito", sans-serif);
        }

        .de-topbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--pz-bg-elevated, #fff);
            border-bottom: 2px solid var(--pz-border, #c7ddff);
            flex-shrink: 0;
        }

        .de-brand {
            font-weight: 800;
            font-size: 15px;
            color: var(--pz-text, #1e3a5f);
            margin-right: 4px;
        }

        .de-group {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px;
            border-radius: 12px;
            background: var(--pz-surface, #f8fbff);
            border: 1px solid var(--pz-border, #c7ddff);
        }

        .de-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-width: 36px;
            height: 36px;
            padding: 0 8px;
            border: 2px solid transparent;
            border-radius: 10px;
            background: transparent;
            color: var(--pz-text, #1e3a5f);
            font: inherit;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }

        .de-btn:hover {
            background: var(--pz-accent-soft, rgba(91, 141, 239, 0.12));
        }

        .de-btn--danger {
            color: var(--pz-danger, #f87171);
        }

        .de-btn--accent {
            background: var(--pz-accent, #5b8def);
            color: #fff;
        }

        .de-btn--accent:hover {
            background: var(--pz-accent-hover, #4a7de0);
        }

        .de-size {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0 10px;
            font-weight: 700;
            font-size: 13px;
            color: var(--pz-text, #1e3a5f);
        }

        .de-size input[type="range"] {
            width: 100px;
        }

        .de-main {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .de-sidebar {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 8px;
            background: var(--pz-bg-elevated, #fff);
            border-right: 2px solid var(--pz-border, #c7ddff);
            flex-shrink: 0;
        }

        .de-tool {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            width: 56px;
            padding: 6px 4px;
            border: 2px solid transparent;
            border-radius: 12px;
            background: transparent;
            color: var(--pz-text, #1e3a5f);
            font: inherit;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .de-tool svg {
            width: 22px;
            height: 22px;
        }

        .de-tool:hover {
            background: var(--pz-accent-soft);
        }

        .de-tool.active {
            border-color: var(--pz-accent, #5b8def);
            background: var(--pz-accent-soft);
            color: var(--pz-accent, #5b8def);
        }

        .de-viewport {
            flex: 1;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(45deg, #6b8499 25%, transparent 25%),
                linear-gradient(-45deg, #6b8499 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #6b8499 75%),
                linear-gradient(-45deg, transparent 75%, #6b8499 75%);
            background-size: 24px 24px;
            background-position: 0 0, 0 12px, 12px -12px, -12px 0;
            background-color: #8899aa;
        }

        .de-stage {
            transform-origin: center center;
            flex-shrink: 0;
            padding: 32px;
        }

        .de-canvas-wrap {
            position: relative;
            display: inline-block;
            background-image:
                linear-gradient(45deg, #ccc 25%, transparent 25%),
                linear-gradient(-45deg, #ccc 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #ccc 75%),
                linear-gradient(-45deg, transparent 75%, #ccc 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            border: 2px solid #fff;
            border-radius: 4px;
        }

        #cd-canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: transparent;
        }

        #canvasResizeHandle {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 14px;
            height: 14px;
            background: var(--pz-accent, #5b8def);
            border: 2px solid #fff;
            border-radius: 3px 0 0 0;
            cursor: nwse-resize;
            transform-origin: bottom right;
        }

        .de-bottom {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: var(--pz-bg-elevated, #fff);
            border-top: 2px solid var(--pz-border, #c7ddff);
            flex-shrink: 0;
        }

        #colorPicker {
            width: 40px;
            height: 32px;
            padding: 0;
            border: 2px solid var(--pz-border);
            border-radius: 8px;
            cursor: pointer;
            background: none;
        }

        #colorPalette {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            flex: 1;
        }

        .de-swatch {
            width: 22px;
            height: 18px;
            padding: 0;
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 4px;
            cursor: pointer;
        }

        .de-hint {
            font-size: 11px;
            color: var(--pz-text-muted, #5b7a9d);
            white-space: nowrap;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(30, 58, 95, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: var(--pz-radius, 14px);
            max-width: 360px;
            width: 90vw;
            box-shadow: var(--pz-shadow);
        }

        .modal-content h3 {
            margin: 0 0 8px;
            color: var(--pz-text);
        }

        .modal-content p {
            margin: 0 0 12px;
            color: var(--pz-text-muted);
        }

        .modal-input-wrapper input {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--pz-border);
            border-radius: 10px;
            font: inherit;
            box-sizing: border-box;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 10px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-ok { background: var(--pz-play, #34c759); color: #fff; }
        .btn-cancel { background: #e2e8f0; color: var(--pz-text); }
    </style>
</head>
<body>
<div id="drawEditorApp">
    <header class="de-topbar">
        <span class="de-brand">Спрайт</span>

        <div class="de-group">
            <button type="button" id="openBtn" class="de-btn" title="Открыть">Открыть</button>
            <button type="button" id="saveBtn" class="de-btn" title="Скачать PNG">Сохранить</button>
            <button type="button" id="undoBtn" class="de-btn" title="Отменить">↩</button>
            <button type="button" id="redoBtn" class="de-btn" title="Повторить">↪</button>
        </div>

        <div class="de-group">
            <button type="button" id="zoomOutBtn" class="de-btn" title="Уменьшить">−</button>
            <span id="zoomLabel" class="de-size" style="min-width:3ch;text-align:center;">4×</span>
            <button type="button" id="zoomInBtn" class="de-btn" title="Увеличить">+</button>
            <button type="button" id="zoom11Btn" class="de-btn" title="100%">1:1</button>
            <button type="button" id="zoomFitBtn" class="de-btn" title="Вписать">⊡</button>
        </div>

        <label class="de-size">
            Кисть
            <input type="range" id="brushSize" min="1" max="32" value="1">
            <span id="brushSizeLabel">1</span> px
        </label>

        <button type="button" id="closeBtn" class="de-btn de-btn--accent" style="margin-left:auto;">Готово</button>
        <input type="file" id="fileInput" accept="image/*" hidden>
    </header>

    <div class="de-main">
        <aside class="de-sidebar">
            <button type="button" class="de-tool active" data-tool="brush" id="brushBtn" title="Кисть">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 3-9 9H3v-3l9-9zm7 7l2 2-2 2-2-2 2-2z"/></svg>
                Кисть
            </button>
            <button type="button" class="de-tool" data-tool="eraser" id="eraserBtn" title="Ластик">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 3l5 5-10 10H6v-5L16 3zM4 20h16v2H4v-2z"/></svg>
                Ластик
            </button>
            <button type="button" class="de-tool" data-tool="fill" id="fillBtn" title="Заливка">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 5.6l2.8 2.8-9.3 9.3-2.8-2.8 9.3-9.3zM5 19h14v2H5v-2z"/></svg>
                Заливка
            </button>
            <button type="button" class="de-tool" data-tool="eyedropper" id="eyedropperBtn" title="Пипетка">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 2l12 12-2 2-5-5-5 5-2-2 5-5L7 2zm12 12l2 2-2 2-2-2 2-2z"/></svg>
                Цвет
            </button>
            <button type="button" class="de-tool de-tool-action" id="clearBtn" title="Очистить">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 7h12l-1 12H7L6 7zm3-3h6l1 2H8l1-2z"/></svg>
                Очистить
            </button>
        </aside>

        <div class="de-viewport" id="viewport">
            <div class="de-stage" id="canvasStage">
                <div class="de-canvas-wrap" id="canvasContainer">
                    <canvas id="cd-canvas" width="128" height="128"></canvas>
                    <div id="canvasResizeHandle" title="Изменить размер холста"></div>
                </div>
            </div>
        </div>
    </div>

    <footer class="de-bottom">
        <input type="color" id="colorPicker" value="#000000">
        <div id="colorPalette"></div>
        <span class="de-hint">Ctrl + колёсико — зум</span>
    </footer>
</div>

<div id="modal-container" class="modal-overlay">
    <div class="modal-content">
        <h3 id="modal-title"></h3>
        <p id="modal-text"></p>
        <div id="modal-input-wrapper" class="modal-input-wrapper" style="display:none;">
            <input type="text" id="modal-input-field" placeholder="Введите текст…">
        </div>
        <div class="modal-buttons">
            <button type="button" id="modal-cancel-btn" class="btn btn-cancel">Отмена</button>
            <button type="button" id="modal-ok-btn" class="btn btn-ok">OK</button>
        </div>
    </div>
</div>

<script src="./lib/jsfs2.js"></script>
<script src="./lib/draw-editor.js"></script>
<script>
var ModalUI = {
    container: document.getElementById('modal-container'),
    title: document.getElementById('modal-title'),
    text: document.getElementById('modal-text'),
    inputWrapper: document.getElementById('modal-input-wrapper'),
    inputField: document.getElementById('modal-input-field'),
    okBtn: document.getElementById('modal-ok-btn'),
    cancelBtn: document.getElementById('modal-cancel-btn'),

    show: function (title, text, type) {
        var self = this;
        return new Promise(function (resolve) {
            self.title.textContent = title || '';
            self.text.textContent = text || '';
            self.inputField.value = '';
            self.inputWrapper.style.display = type === 'input' ? 'block' : 'none';
            self.cancelBtn.style.display = type === 'message' ? 'none' : 'inline-block';
            self.container.style.display = 'flex';

            function cleanup() {
                self.container.style.display = 'none';
            }

            self.okBtn.onclick = function () {
                cleanup();
                resolve(type === 'input' ? self.inputField.value : true);
            };
            self.cancelBtn.onclick = function () {
                cleanup();
                resolve(type === 'input' ? null : false);
            };

            if (type === 'input') setTimeout(function () { self.inputField.focus(); }, 80);
        });
    }
};

function message(title, text) { return ModalUI.show(title, text, 'message'); }
function askConfirm(title, text) { return ModalUI.show(title, text, 'confirm'); }
function input(title, text) { return ModalUI.show(title, text, 'input'); }

document.addEventListener('DOMContentLoaded', function () {
    if (typeof window.FileSystem !== 'undefined') {
        window.jsfs = new window.FileSystem('PGZfs');
    }
    initDrawEditor();
});
</script>
</body>
</html>
