<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="drawEditor.pageTitle">Редактор спрайтов — PGZero Studio</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.png" type="image/png" sizes="256x256">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#0f172a">
    <link rel="stylesheet" href="theme.css?v=0.074">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #5b7a9d;
        }

        #drawEditorApp {
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: var(--pz-font, "Nunito", sans-serif);
        }

        .de-topbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--pz-bg-elevated, #fff);
            border-bottom: 2px solid var(--pz-border, #c7ddff);
            flex-shrink: 0;
        }

        .de-brand {
            font-weight: 800;
            font-size: 15px;
            color: var(--pz-text, #1e3a5f);
            margin-right: 4px;
        }

        .de-group {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px;
            border-radius: 12px;
            background: var(--pz-surface, #f8fbff);
            border: 1px solid var(--pz-border, #c7ddff);
        }

        .de-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-width: 36px;
            height: 36px;
            padding: 0 8px;
            border: 2px solid transparent;
            border-radius: 10px;
            background: transparent;
            color: var(--pz-text, #1e3a5f);
            font: inherit;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }

        .de-btn:hover {
            background: var(--pz-accent-soft, rgba(91, 141, 239, 0.12));
        }

        .de-btn--danger {
            color: var(--pz-danger, #f87171);
        }

        .de-btn--accent {
            background: var(--pz-accent, #5b8def);
            color: #fff;
        }

        .de-btn--accent:hover {
            background: var(--pz-accent-hover, #4a7de0);
        }

        .de-size {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0 10px;
            font-weight: 700;
            font-size: 13px;
            color: var(--pz-text, #1e3a5f);
        }

        .de-size input[type="range"] {
            width: 100px;
        }

        .de-main {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .de-sidebar {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 8px;
            background: var(--pz-bg-elevated, #fff);
            border-right: 2px solid var(--pz-border, #c7ddff);
            flex-shrink: 0;
        }

        .de-tool {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            width: 56px;
            padding: 6px 4px;
            border: 2px solid transparent;
            border-radius: 12px;
            background: transparent;
            color: var(--pz-text, #1e3a5f);
            font: inherit;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .de-tool svg {
            width: 22px;
            height: 22px;
        }

        .de-tool:hover {
            background: var(--pz-accent-soft);
        }

        .de-tool.active {
            border-color: var(--pz-accent, #5b8def);
            background: var(--pz-accent-soft);
            color: var(--pz-accent, #5b8def);
        }

        .de-viewport.can-pan, .de-viewport.can-pan #cd-canvas { cursor: grab !important; }
        .de-viewport.is-panning, .de-viewport.is-panning #cd-canvas { cursor: grabbing !important; }
        .de-crop-overlay { position:absolute; box-sizing:border-box; border:1px dashed #fff; outline:1px solid #1e3a5f; background:rgba(91,141,239,.18); pointer-events:auto; cursor:move; }
        .de-crop-overlay[hidden], #cropActions[hidden] { display:none !important; }
        .de-crop-handle { position:absolute; width:var(--crop-handle, 12px); height:var(--crop-handle, 12px); background:#fff; border:1px solid #24559c; box-sizing:border-box; }
        .de-crop-handle[data-crop-handle="nw"] { left:0; top:0; transform:translate(-50%,-50%); cursor:nwse-resize; }
        .de-crop-handle[data-crop-handle="ne"] { right:0; top:0; transform:translate(50%,-50%); cursor:nesw-resize; }
        .de-crop-handle[data-crop-handle="sw"] { left:0; bottom:0; transform:translate(-50%,50%); cursor:nesw-resize; }
        .de-crop-handle[data-crop-handle="se"] { right:0; bottom:0; transform:translate(50%,50%); cursor:nwse-resize; }
        #cropActions { position: fixed; z-index: 30; display: inline-flex; gap: 4px; padding: 4px; border: 1px solid var(--pz-border, #c7ddff); border-radius: 10px; background: var(--pz-bg-elevated, #fff); box-shadow: 0 4px 12px rgba(30, 58, 95, .18); }
        .de-crop-action { display: inline-flex; align-items: center; gap: 5px; min-height: 32px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: var(--pz-text, #1e3a5f); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .de-crop-action--apply { background: var(--pz-accent-soft, #e9f0ff); color: var(--pz-text, #1e3a5f); }
        .de-crop-action:hover { background: var(--pz-accent-soft, #e9f0ff); }
        .de-crop-action:focus-visible { outline: 2px solid var(--pz-accent, #5b8def); outline-offset: 1px; }
        .de-crop-action svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .de-btn:focus-visible, .de-tool:focus-visible { outline: 3px solid var(--pz-accent, #5b8def); outline-offset: 2px; }

        .de-viewport {
            flex: 1;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(45deg, #6b8499 25%, transparent 25%),
                linear-gradient(-45deg, #6b8499 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #6b8499 75%),
                linear-gradient(-45deg, transparent 75%, #6b8499 75%);
            background-size: 24px 24px;
            background-position: 0 0, 0 12px, 12px -12px, -12px 0;
            background-color: #8899aa;
        }

        .de-stage {
            transform-origin: center center;
            flex-shrink: 0;
            padding: 32px;
        }

        .de-canvas-wrap {
            position: relative;
            display: inline-block;
            background-image:
                linear-gradient(45deg, #ccc 25%, transparent 25%),
                linear-gradient(-45deg, #ccc 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #ccc 75%),
                linear-gradient(-45deg, transparent 75%, #ccc 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0;
            box-shadow: 0 2px 8px rgba(30, 58, 95, 0.16);
            border: 2px solid #fff;
            border-radius: 4px;
        }

        #cd-canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: transparent;
        }

        .de-bottom {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: var(--pz-bg-elevated, #fff);
            border-top: 2px solid var(--pz-border, #c7ddff);
            flex-shrink: 0;
        }

        #colorPicker {
            width: 40px;
            height: 32px;
            padding: 0;
            border: 2px solid var(--pz-border);
            border-radius: 8px;
            cursor: pointer;
            background: none;
        }

        #colorPalette {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            flex: 1;
        }

        .de-swatch {
            width: 22px;
            height: 18px;
            padding: 0;
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 4px;
            cursor: pointer;
        }

        .de-hint {
            font-size: 11px;
            color: var(--pz-text-muted, #5b7a9d);
            min-width: 0;
            line-height: 1.4;
        }

        .de-brush-cursor {
            position: fixed;
            pointer-events: none;
            border: 1.5px solid rgba(30, 58, 95, 0.92);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.92);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10000;
            box-sizing: border-box;
        }

        .de-brush-cursor.is-square {
            border-radius: 1px;
        }

        .de-brush-cursor.is-eraser {
            border-style: dashed;
            background: rgba(255, 255, 255, 0.12);
        }

        .de-brush-cursor[hidden] {
            display: none !important;
        }

        .de-tool .de-icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .de-tool .de-icon--stroke {
            fill: none;
            stroke: currentColor;
            stroke-width: 1.75;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .de-btn .de-icon--color { width: 18px; height: 18px; }

        .de-btn .de-icon--stroke {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Compact, readable workspace controls */
        .de-topbar { gap: 10px; padding: 10px 14px; border-bottom-width: 1px; }
        .de-brand { font-size: 16px; font-weight: 700; margin-right: 8px; }
        .de-group { gap: 2px; border-radius: 10px; }
        .de-btn { border-radius: 8px; }
        .de-btn:disabled { opacity: .4; cursor: default; }
        .de-sidebar { width: 142px; box-sizing: border-box; padding: 10px 8px; gap: 2px; border-right-width: 1px; }
        .de-tool { width: 100%; min-height: 39px; flex-direction: row; justify-content: flex-start; gap: 9px; padding: 7px 9px; border-width: 1px; border-radius: 8px; font-size: 12px; text-align: left; }
        .de-tool .de-icon { width: 20px; height: 20px; }
        .de-tool.active { color: var(--pz-text, #1e3a5f); font-weight: 700; }
        .de-tool[data-tool="crop"] { margin-top: 9px; }
        .de-tool-action { margin-top: 9px; }
        .de-viewport { background: #c5d0db; }
        .de-canvas-wrap { border-radius: 2px; }
        .de-bottom { flex-wrap: wrap; gap: 8px 12px; border-top-width: 1px; }
        #colorPalette { flex: 1 1 340px; gap: 5px; }
        .de-swatch { width: 23px; height: 23px; }
        .de-swatch:focus-visible { outline: 2px solid var(--pz-accent, #5b8def); outline-offset: 2px; }
        .de-hint { flex: 1 1 100%; font-size: 12px; color: var(--pz-text, #1e3a5f); }
        @media (max-width: 700px) {
            .de-topbar { gap: 5px; padding: 6px 8px; }
            .de-brand { display: none; }
            .de-size input[type="range"] { width: 65px; }
            .de-sidebar { width: 60px; padding: 6px 4px; }
            .de-tool { flex-direction: column; justify-content: center; gap: 2px; padding: 5px 2px; font-size: 10px; text-align: center; overflow-wrap: anywhere; }
            .de-bottom { padding: 6px 8px; }
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(30, 58, 95, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: var(--pz-radius, 14px);
            max-width: 360px;
            width: 90vw;
            box-shadow: var(--pz-shadow);
        }

        .modal-content h3 {
            margin: 0 0 8px;
            color: var(--pz-text);
        }

        .modal-content p {
            margin: 0 0 12px;
            color: var(--pz-text-muted);
        }

        .modal-input-wrapper input {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--pz-border);
            border-radius: 10px;
            font: inherit;
            box-sizing: border-box;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 10px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-ok { background: var(--pz-play, #34c759); color: #fff; }
        .btn-cancel { background: #e2e8f0; color: var(--pz-text); }
    </style>
</head>
<body>
<div id="drawEditorApp">
    <header class="de-topbar">
        <span class="de-brand" data-i18n="drawEditor.brand">Спрайт</span>

        <div class="de-group">
            <button type="button" id="openBtn" class="de-btn" data-i18n-title="drawEditor.open" title="Открыть"><span data-i18n="drawEditor.open">Открыть</span></button>
            <button type="button" id="saveBtn" class="de-btn" data-i18n-title="drawEditor.saveDownloadTitle" title="Скачать PNG"><span data-i18n="drawEditor.save">Сохранить</span></button>
            <button type="button" id="undoBtn" class="de-btn" data-i18n-title="drawEditor.undo" title="Отменить">
                <img class="de-icon--color" src="./assets/icons/iconpark/undo.svg" alt="" aria-hidden="true">
            </button>
            <button type="button" id="redoBtn" class="de-btn" data-i18n-title="drawEditor.redo" title="Повторить">
                <img class="de-icon--color" src="./assets/icons/iconpark/redo.svg" alt="" aria-hidden="true">
            </button>
        </div>

        <div class="de-group">
            <button type="button" id="zoomOutBtn" class="de-btn" data-i18n-title="drawEditor.zoomOut" title="Уменьшить"><img class="de-icon--color" src="./assets/icons/iconpark/zoom-out.svg" alt="" aria-hidden="true"></button>
            <span id="zoomLabel" class="de-size" style="min-width:3ch;text-align:center;">4×</span>
            <button type="button" id="zoomInBtn" class="de-btn" data-i18n-title="drawEditor.zoomIn" title="Увеличить"><img class="de-icon--color" src="./assets/icons/iconpark/zoom-in.svg" alt="" aria-hidden="true"></button>
            <button type="button" id="zoom11Btn" class="de-btn" data-i18n-title="drawEditor.zoom100" title="100%">1:1</button>
            <button type="button" id="zoomFitBtn" class="de-btn" data-i18n-title="drawEditor.zoomFit" title="Вписать"><img class="de-icon" src="./assets/icons/iconpark/crop.svg" alt="" aria-hidden="true"></button>
        </div>

        <label class="de-size">
            <span id="brushSizeTitle" data-i18n="drawEditor.brush">Кисть</span>
            <input type="range" id="brushSize" min="1" max="32" value="1">
            <span id="brushSizeLabel">1</span> px

        <button type="button" id="closeBtn" class="de-btn de-btn--accent" style="margin-left:auto;" data-i18n="drawEditor.done">Готово</button>
        <input type="file" id="fileInput" accept="image/*" hidden>
    </header>

    <div class="de-main">
        <aside class="de-sidebar">
            <button type="button" class="de-tool" data-tool="pan" data-i18n-title="drawEditor.pan" title="Переместить">
                <img class="de-icon" src="./assets/icons/iconpark/move.svg" alt="" aria-hidden="true">
                <span data-i18n="drawEditor.pan">Переместить</span>
            </button>
            <button type="button" class="de-tool active" data-tool="brush" data-i18n-title="drawEditor.brush" title="Кисть">
                <img class="de-icon" src="./assets/icons/fluent-color/paint_brush_24_color.svg" alt="" aria-hidden="true">
                <span data-i18n="drawEditor.brush">Кисть</span>
            </button>
            <button type="button" class="de-tool" data-tool="pencil" data-i18n-title="drawEditor.pencilTitle" title="Пиксельный карандаш">
                <img class="de-icon" src="./assets/icons/iconpark/pencil.svg" alt="" aria-hidden="true">
                <span data-i18n="drawEditor.pencil">Пиксель</span>
            </button>
            <button type="button" class="de-tool" data-tool="mirror" data-i18n-title="drawEditor.mirrorBrushTitle" title="Зеркальная кисть">
                <img class="de-icon" src="./assets/icons/iconpark/flip.svg" alt="" aria-hidden="true">
                <span data-i18n="drawEditor.mirror">Зеркало</span>
            </button>
            <button type="button" class="de-tool" data-tool="eraser" data-i18n-title="drawEditor.eraser" title="Ластик">
                <img class="de-icon" src="./assets/icons/iconpark/eraser.svg" alt="" aria-hidden="true">
                <span data-i18n="drawEditor.eraser">Ластик</span>
            </button>
            <button type="button" class="de-tool" data-tool="fill" data-i18n-title="drawEditor.fill" title="Заливка">

            <button type="button" class="de-tool" data-tool="eyedropper" data-i18n-title="drawEditor.eyedropper" title="Пипетка">
                <img class="de-icon" src="./assets/icons/material/dropper.svg" alt="" aria-hidden="true">
                <span data-i18n="drawEditor.eyedropper">Пипетка</span>

            <button type="button" class="de-tool" data-tool="removeBackground" data-i18n-title="drawEditor.removeBackgroundHint" title="Нажмите на однотонный фон">
                <img class="de-icon" src="./assets/icons/iconpark/background.svg" alt="" aria-hidden="true">
                <span data-i18n="drawEditor.removeBackground">Убрать фон</span>
            </button>
            <button type="button" class="de-tool de-tool-action" id="clearBtn" data-i18n-title="drawEditor.clearCanvasTitle" title="Очистить холст">
                <img class="de-icon" src="./assets/icons/iconpark/delete.svg" alt="" aria-hidden="true">

        <div class="de-viewport" id="viewport">

                    <div id="cropOverlay" class="de-crop-overlay" hidden aria-hidden="true"><span class="de-crop-handle" data-crop-handle="nw"></span><span class="de-crop-handle" data-crop-handle="ne"></span><span class="de-crop-handle" data-crop-handle="sw"></span><span class="de-crop-handle" data-crop-handle="se"></span></div>
                </div>

    <footer class="de-bottom">
        <input type="color" id="colorPicker" value="#000000">
        <div id="colorPalette"></div>
        <span id="toolHint" class="de-hint" role="status" aria-live="polite">Круг у курсора показывает размер кисти.</span>
    </footer>
</div>

<div id="cropActions" class="de-crop-actions" hidden>
    <button type="button" id="cropApplyBtn" class="de-crop-action de-crop-action--apply"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg><span data-i18n="drawEditor.cropApply">Принять</span></button>
    <button type="button" id="cropCancelBtn" class="de-crop-action"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg><span data-i18n="common.cancel">Отмена</span></button>
</div>

<div id="brushCursor" class="de-brush-cursor" hidden aria-hidden="true"></div>

<div id="modal-container" class="modal-overlay">
    <div class="modal-content">
        <h3 id="modal-title"></h3>
        <p id="modal-text"></p>
        <div id="modal-input-wrapper" class="modal-input-wrapper" style="display:none;">
            <input type="text" id="modal-input-field" data-i18n-placeholder="modal.inputPlaceholder" placeholder="Введите текст…">
        </div>
        <div class="modal-buttons">
            <button type="button" id="modal-cancel-btn" class="btn btn-cancel" data-i18n="common.cancel">Отмена</button>
            <button type="button" id="modal-ok-btn" class="btn btn-ok" data-i18n="common.ok">OK</button>
        </div>
    </div>
</div>

<script>
var ModalUI = {
    container: document.getElementById('modal-container'),
    title: document.getElementById('modal-title'),
    text: document.getElementById('modal-text'),
    inputWrapper: document.getElementById('modal-input-wrapper'),
    inputField: document.getElementById('modal-input-field'),
    okBtn: document.getElementById('modal-ok-btn'),
    cancelBtn: document.getElementById('modal-cancel-btn'),

    show: function (title, text, type) {
        var self = this;
        return new Promise(function (resolve) {
            self.title.textContent = title || '';
            self.text.textContent = text || '';
            self.inputField.value = '';
            self.inputWrapper.style.display = type === 'input' ? 'block' : 'none';
            self.cancelBtn.style.display = type === 'message' ? 'none' : 'inline-block';
            self.container.style.display = 'flex';

            function cleanup() {
                self.container.style.display = 'none';
            }

            self.okBtn.onclick = function () {
                cleanup();
                resolve(type === 'input' ? self.inputField.value : true);
            };
            self.cancelBtn.onclick = function () {
                cleanup();
                resolve(type === 'input' ? null : false);
            };

            if (type === 'input') setTimeout(function () { self.inputField.focus(); }, 80);
        });
    }
};

function message(title, text) { return ModalUI.show(title, text, 'message'); }
function askConfirm(title, text) { return ModalUI.show(title, text, 'confirm'); }
function input(title, text) { return ModalUI.show(title, text, 'input'); }

document.addEventListener('DOMContentLoaded', function () {
    PZTooltip.init();
    if (typeof window.FileSystem !== 'undefined') {
        window.jsfs = new window.FileSystem('PGZfs');
    }
    PGZI18n.init().then(function () {
